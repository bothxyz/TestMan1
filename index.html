  <style>
  
    /* Modal animasi */
    #form-modal .modal-container {
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.3s ease;
    }
    #form-modal.show .modal-container {
      opacity: 1;
      transform: scale(1);
    }

    /* Lock body scroll */
    body.overflow-hidden {
      position: fixed;
      width: 100%;
      overflow: hidden;
      left: 0;
    }

    /* Loader */
    .loader {
      border-radius: 50%;
      border: 4px solid #ff1476;
      border-top: 4px solid transparent;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Fade in untuk fallback */
    .fade-in {
      animation: fadeIn 0.3s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Hover effects */
    .schedule-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.3);
    }

    /* Responsive adjustments */
    @media (max-width: 640px) {
      .modal-container {
        height: 95vh;
        margin: 2.5vh 10px;
      }
    }

    /* Iframe fit */
    .iframe-container {
      height: 100%;
      overflow: hidden;
    }
  </style>

  <script>

// Slideshow 
  document.addEventListener("DOMContentLoaded", function () {
    let currentSlide = 0;
    const slides = document.querySelectorAll("#slideshow .slide");

    if (slides.length > 0) {
      slides.forEach((slide, index) => {
        slide.style.opacity = index === 0 ? '1' : '0';
        slide.style.zIndex = index === 0 ? '10' : '0';
      });

      setInterval(function () {
        slides[currentSlide].style.opacity = "0";
        slides[currentSlide].style.zIndex = "0";

        currentSlide = (currentSlide + 1) % slides.length;

        slides[currentSlide].style.opacity = "1";
        slides[currentSlide].style.zIndex = "10";
      }, 4000);
    }
  });
</script>

<!-- JavaScript -->

<script>
  function scrollToSection(id) {
    const section = document.getElementById(id);
    if (section) {
      section.scrollIntoView({ behavior: 'smooth' });

      // Hilangkan fragment (#services) dari URL
      history.pushState("", document.title, window.location.pathname + window.location.search);
    }
  }
</script>

<script>
  window.addEventListener("load", () => {
    const hash = window.location.hash;
    if (hash && document.querySelector(hash)) {
      document.querySelector(hash).scrollIntoView({ behavior: "smooth" });

      // Hapus # dari URL setelah scroll
      setTimeout(() => {
        history.replaceState(null, null, window.location.pathname);
      }, 400);
    }
  });
</script>

<script>
  function toggleMobileMenu() {
    const navLinks = document.getElementById('mobileNav');
    navLinks.classList.toggle('active');
  }

  function handleMobileNavClick(event) {
    event.preventDefault(); // Mencegah default jump
    const navLinks = document.getElementById('mobileNav');
    navLinks.classList.remove('active'); // Sembunyikan menu

    const targetId = event.target.getAttribute('href');
    const target = document.querySelector(targetId);
    if (target) {
      target.scrollIntoView({ behavior: 'smooth' });

      // Hilangkan hash dari URL
      setTimeout(() => {
        history.replaceState(null, null, window.location.pathname);
      }, 400);
    }
  }

  // Jika halaman dibuka langsung dengan hash (misalnya /#contact)
  window.addEventListener('DOMContentLoaded', () => {
    const hash = window.location.hash;
    if (hash && document.querySelector(hash)) {
      document.querySelector(hash).scrollIntoView({ behavior: 'smooth' });

      setTimeout(() => {
        history.replaceState(null, null, window.location.pathname);
      }, 400);
    }
  });
</script>
